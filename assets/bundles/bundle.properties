block.goblin-link-goblin-link.name = Goblin Link
block.goblin-link-goblin-link.description = Connects the core to adjacent blocks for automatic item transfer. Without modules it holds only 10 of each item and moves 2 items per second. Goblin Storage modules raise capacity, Goblin Processors raise speed.
block.goblin-link-goblin-processor.name = Goblin Processor
block.goblin-link-goblin-processor.description = Speeds up Goblin Link item transfer. Uses power. To link it, tap the processor, then tap a Link in range. Tap the Link again to unlink.
block.goblin-link-goblin-storage.name = Goblin Storage
block.goblin-link-goblin-storage.description = Increases Goblin Link capacity. Uses power. To link it, tap the storage, then tap a Link in range. Tap the Link again to unlink.
