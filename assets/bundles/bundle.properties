block.goblin-link-goblin-link.name = Goblin Link
block.goblin-link-goblin-link.description = Connects the core to adjacent blocks for automatic item transfer. Without modules it holds only 10 of each item and moves 2 items per second. Goblin Storage raises capacity, Goblin Processor raises speed. Modules link directly or through a Goblin Node.
block.goblin-link-goblin-processor.name = Goblin Processor (early game)
block.goblin-link-goblin-processor.description = Speeds up Goblin Link item transfer. Uses power. Tap the processor, then a Link or Goblin Node in range to link. Tap again to unlink.
block.goblin-link-goblin-storage.name = Goblin Storage (early game)
block.goblin-link-goblin-storage.description = Increases Goblin Link capacity. Uses power. Tap the storage, then a Link or Goblin Node in range to link. Tap again to unlink.
block.goblin-link-goblin-node.name = Goblin Node (early game)
block.goblin-link-goblin-node.description = Long link range. Tap the node, then a Link (to attach the node to it) and modules in range (to attach them to the node). Tap again to unlink.
