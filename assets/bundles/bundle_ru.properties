block.goblin-link-goblin-link.name = Гоблин Линк
block.goblin-link-goblin-link.description = Связывает ядро с соседними блоками для автоматической передачи ресурсов. Без модулей вмещает всего 10 предметов каждого вида и передаёт 2 предмета в секунду. Ёмкость увеличивают Гоблин-хранилища, скорость - Гоблин-процессоры. Модули можно привязать напрямую или через Гоблин-узел.
block.goblin-link-goblin-processor.name = Гоблин-процессор (ранняя стадия)
block.goblin-link-goblin-processor.description = Ускоряет передачу предметов Гоблин Линка. Потребляет энергию. Нажмите на процессор, затем на Линк или Гоблин-узел в радиусе, чтобы связать. Повторное нажатие разрывает связь.
block.goblin-link-goblin-storage.name = Гоблин-хранилище (ранняя стадия)
block.goblin-link-goblin-storage.description = Увеличивает ёмкость Гоблин Линка. Потребляет энергию. Нажмите на хранилище, затем на Линк или Гоблин-узел в радиусе, чтобы связать. Повторное нажатие разрывает связь.
block.goblin-link-goblin-node.name = Гоблин-узел (ранняя стадия)
block.goblin-link-goblin-node.description = Большой радиус связи. Нажмите на узел, затем на Линк (привязать узел к Линку) и на модули в радиусе (привязать их к узлу). Повторное нажатие разрывает связь.
