block.goblin-link-goblin-link.name = Гоблин Линк
block.goblin-link-goblin-link.description = Связывает ядро с соседними блоками для автоматической передачи ресурсов. Без модулей вмещает всего 10 предметов каждого вида и передаёт 2 предмета в секунду. Ёмкость увеличивают Гоблин-хранилища, скорость - Гоблин-процессоры.
block.goblin-link-goblin-processor.name = Гоблин-процессор
block.goblin-link-goblin-processor.description = Ускоряет передачу предметов Гоблин Линка. Потребляет энергию. Чтобы связать с Линком, нажмите на процессор, затем на Линк в радиусе действия. Повторное нажатие на Линк разрывает связь.
block.goblin-link-goblin-storage.name = Гоблин-хранилище
block.goblin-link-goblin-storage.description = Увеличивает ёмкость Гоблин Линка. Потребляет энергию. Чтобы связать с Линком, нажмите на хранилище, затем на Линк в радиусе действия. Повторное нажатие на Линк разрывает связь.
