name: Build Mod

on: [push, pull_request]

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Build mod jar
      run: |
        chmod +x ./gradlew
        ./gradlew deploy
    - name: Upload built jar file
      uses: actions/upload-artifact@v7
      with:
        archive: false
        name: ${{ github.event.repository.name }}
        path: build/libs/${{ github.event.repository.name }}.jar
    - name: Publish latest release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        JAR="build/libs/${{ github.event.repository.name }}.jar"
        gh release delete latest --cleanup-tag --yes || true
        gh release create latest "$JAR" --target "${{ github.sha }}" --latest \
          --title "Latest build" --notes "Автоматическая сборка из master."
    - name: Publish versioned release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(grep -oP '^version:\s*"\K[^"]+' mod.hjson)
        JAR="build/libs/${{ github.event.repository.name }}.jar"
        if ! gh release view "v$VERSION" >/dev/null 2>&1; then
          gh release create "v$VERSION" "$JAR" --target "${{ github.sha }}" --latest=false \
            --title "Goblin Link v$VERSION" --notes "Версия $VERSION. Скачайте .jar и импортируйте в Mindustry (Моды -> Импорт мода)."
        fi
